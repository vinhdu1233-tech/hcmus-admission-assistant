# Local deployment smoke test. Public use requires HTTPS reverse proxy and real SMTP.
services:
  guide:
    build: .
    env_file: .env
    environment:
      HCMUS_DB_PATH: /data/admissions.sqlite3
      HCMUS_PRODUCT_DB_PATH: /data/product.sqlite3
      CHAT_MODE: api
      API_ORIGIN: http://127.0.0.1:8000
      PORT: '8080'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - guide_data:/data
    restart: unless-stopped
volumes:
  guide_data:
