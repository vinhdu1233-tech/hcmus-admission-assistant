name: HCMUS MVP checks

on:
  push:
    branches: [feat/mvp-sqlite-router]
  pull_request:
    branches: [main]

jobs:
  backend-and-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-backend-dev.txt
      - name: Test backend and multi-turn context without AI network
        env:
          AI_PROVIDER: none
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          python -m pytest -q tests/test_api_smoke.py tests/test_db_router.py tests/test_retrieval_ai.py tests/test_official_profiles.py tests/test_conversation.py tests/test_interest_followup.py
      - name: Check Node syntax
        run: node --check ui/server.mjs
      - name: Test Node session cookie and backend forwarding
        run: node --test tests/test_conversation_proxy.mjs
